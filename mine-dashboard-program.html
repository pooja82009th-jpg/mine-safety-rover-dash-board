<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine Safety Monitoring Dashboard</title>
<style>
:root{--bg:#0f1519;--card:#18212a;--bd:#2a3641;--tx:#e8eef3;--mut:#93a1ad;--ok:#3ccf8a;--warn:#f0b03a;--dan:#ff6b64;
--zone:#202c36;--okbg:#14332a;--warnbg:#3a2e12;--danbg:#40191a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}

/* header */
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:24px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.pill{padding:10px 22px;border-radius:99px;font-weight:700;font-size:17px;background:var(--ok);color:#06210f}
.pill.l1{background:var(--warn);color:#1b1300}
.pill.l2{background:var(--dan);color:#2a0504;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}

/* panels */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:15px}
.main{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.side{display:grid;gap:16px;grid-template-rows:auto 1fr}
@media(max-width:850px){.main{grid-template-columns:1fr}}

/* camera */
.cam{padding:8px}
#cam{display:block;width:100%;height:auto;border-radius:8px}

/* map */
#map{width:100%;height:auto;display:block}

/* alerts */
#log{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto}
#log li{padding:7px 12px;margin-bottom:6px;border-radius:8px;border-left:5px solid;font-size:13px}
#log li.l1{background:var(--warnbg);border-color:var(--warn)}
#log li.l2{background:var(--danbg);border-color:var(--dan)}
#log li.l0{background:var(--okbg);border-color:var(--ok)}
#log time{display:block;font-size:11px;color:var(--mut)}

/* sensor cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--bd);border-top:6px solid var(--ok);border-radius:12px;padding:12px}
.card.l1{border-top-color:var(--warn)}
.card.l2{border-top-color:var(--dan)}
.card .n{font-size:12px;font-weight:700;color:var(--mut)}
.card .v{font-size:36px;font-weight:700;margin-top:8px;line-height:1.1}
.card .u{font-size:13px;color:var(--mut);margin-bottom:8px}
.bar{height:9px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:5px;transition:width .4s}
.l1 .bar i{background:var(--warn)}
.l2 .bar i{background:var(--dan)}
.row{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mut)}
.row b{color:var(--ok)}
.l1 .row b{color:var(--warn)}
.l2 .row b{color:var(--dan)}

/* demo buttons */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--mut)}
button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>MINE SAFETY MONITORING DASHBOARD</h1>
    <div class="sub">Live conditions | Site: Shaft 2 - Level 4 | <span id="clock"></span></div>
  </div>
  <div id="status" class="pill">ALL SAFE</div>
</header>

<div class="main">
  <!-- Rover camera display -->
  <div class="panel cam">
    <canvas id="cam" width="640" height="380"></canvas>
  </div>

  <div class="side">
    <!-- Tunnel map with rover -->
    <div class="panel">
      <h2>Tunnel map and rover</h2>
      <svg id="map" viewBox="0 0 440 110" role="img" aria-label="Tunnel map with rover">
        <g id="zones"></g>
        <g id="rover" transform="translate(275,70)">
          <text y="-44" text-anchor="middle" font-size="10" fill="#93a1ad">ROVER-01</text>
          <line y1="-12" y2="-24" stroke="#93a1ad" stroke-width="2"/>
          <circle id="lamp" cy="-27" r="5" fill="#3ccf8a"/>
          <rect x="-22" y="-12" width="44" height="20" rx="4" fill="#e8eef3"/>
          <rect x="-9" y="-8" width="18" height="7" rx="2" fill="#18212a"/>
          <circle cx="-13" cy="10" r="6" fill="#93a1ad"/>
          <circle cx="13" cy="10" r="6" fill="#93a1ad"/>
        </g>
      </svg>
    </div>

    <!-- Alerts -->
    <div class="panel">
      <h2>Alert notifications</h2>
      <ul id="log"></ul>
    </div>
  </div>
</div>

<!-- Sensor cards -->
<div class="cards" id="cards"></div>

<div class="ctl">
  <span>Demo:</span>
  <button data-sim="0">Methane leak</button>
  <button data-sim="1,2">CO / H₂S release</button>
  <button data-sim="3">Low oxygen</button>
  <button data-sim="4">Heat rise</button>
  <button data-sim="5,6">Earth tremor</button>
  <button data-sim="reset">Reset</button>
  <button id="camBtn">Use device camera</button>
</div>

</div>

<script>
/* ---------- Sensor definitions (b = normal value, r = noise, w = warning, d = danger, z = bar zero) ---------- */
var S = [
  {n:"Methane (CH₄)",    u:"%",    b:1.2, r:.04, w:1,    d:1.5, x:2, z:0},
  {n:"Carbon monoxide",  u:"ppm",  b:14,  r:2,   w:25,   d:50,  x:0, z:0},
  {n:"Hydrogen sulfide", u:"ppm",  b:2.1, r:.3,  w:5,    d:10,  x:1, z:0},
  {n:"Oxygen (O₂)",      u:"%",    b:20.4,r:.05, w:19.5, d:18,  x:1, z:0, low:1},
  {n:"Temperature",      u:"°C",   b:29.8,r:.4,  w:32,   d:37,  x:1, z:20},
  {n:"Vibration",        u:"mm/s", b:3.4, r:.3,  w:5,    d:10,  x:1, z:0},
  {n:"Seismic activity", u:"ML",   b:1.1, r:.1,  w:2,    d:3,   x:1, z:0}
];
var ZONES = ["A","B","C","D"], $ = function(id){return document.getElementById(id)};
var alerts = [
  {l:0, t:"10:12:03", m:"Temperature normal - all zones"},
  {l:0, t:"10:31:48", m:"Vibration spike 6.1 mm/s - Zone B (cleared)"}
].reverse();
var rx = 275, dir = 1, hz = 2, mx = 0, worst = 0, ph = .35, camLive = false, vid = document.createElement("video");

/* ---------- Build cards and map ---------- */
$("cards").innerHTML = S.map(function(s,i){
  return '<div class="card" id="c'+i+'"><div class="n">'+s.n+'</div>'+
    '<div class="v" id="v'+i+'">-</div><div class="u">'+s.u+'</div>'+
    '<div class="bar"><i id="b'+i+'"></i></div>'+
    '<div class="row"><b id="l'+i+'">Normal</b><span>'+(s.low?"Min ":"Limit ")+s.d+'</span></div></div>';
}).join("");
$("zones").innerHTML = ZONES.map(function(z,i){
  return '<rect id="z'+i+'" x="'+(i*110)+'" y="38" width="110" height="64" fill="#202c36" stroke="#3a4855" stroke-width="2"/>'+
         '<text x="'+(i*110+55)+'" y="118" text-anchor="middle" font-size="11" fill="#93a1ad" transform="translate(0,-6)">Zone '+z+'</text>';
}).join("");
S.forEach(function(s){ s.t = 0; s.e = 0; s.lv = 0; s.v = s.b; });

/* ---------- Helpers ---------- */
function level(s){ var v = s.v;
  return s.low ? (v<=s.d?2 : v<=s.w?1 : 0) : (v>=s.d?2 : v>=s.w?1 : 0); }
function zoneOf(x){ return Math.min(3, Math.max(0, Math.floor(x/110))); }
function renderLog(){
  $("log").innerHTML = alerts.slice(0,6).map(function(a){
    return '<li class="l'+a.l+'"><time>'+a.t+'</time>'+a.m+'</li>'; }).join("");
}

/* ---------- Main update loop (every second) ---------- */
function tick(){
  mx = 0;
  S.forEach(function(s,i){
    s.t *= .96; s.e += (s.t - s.e) * .3;
    s.v = s.b + s.e + (Math.random()-.5)*2*s.r;
    var l = level(s); if (l > mx) { mx = l; worst = i; }
    if (l > s.lv && l > 0) {                       // new hazard detected -> notify
      if (s.lv === 0 && mx === l) hz = zoneOf(rx);
      alerts.unshift({l:l, t:new Date().toLocaleTimeString(),
        m:(l==2?"DANGER: ":"Warning: ")+s.n+" "+s.v.toFixed(s.x)+" "+s.u+" - Zone "+ZONES[zoneOf(rx)]+(l==2?" - evacuate":"")});
      renderLog();
    }
    s.lv = l;
    var p = s.low ? (21-s.v)/(21-s.d) : (s.v-s.z)/(s.d-s.z);
    $("c"+i).className = "card l"+l;
    $("v"+i).textContent = s.v.toFixed(s.x);
    $("b"+i).style.width = Math.max(3, Math.min(100, p*100)) + "%";
    $("l"+i).textContent = ["Normal","Warning","DANGER"][l];
  });
  var all0 = S.every(function(s){return s.lv===0});
  if (all0) hz = null;
  var st = $("status"); st.className = "pill l"+mx;
  st.textContent = mx==0 ? "ALL SAFE" : (mx==1?"WARNING - ":"DANGER - ") + S[worst].n.split(" (")[0].toUpperCase();
  for (var i=0;i<4;i++){
    var z = $("z"+i), bad = (hz === i);
    z.setAttribute("fill", bad ? (mx==2?"#40191a":"#3a2e12") : "#202c36");
    z.setAttribute("stroke", bad ? (mx==2?"#ff6b64":"#f0b03a") : "#3a4855");
  }
  $("lamp").setAttribute("fill", ["#3ccf8a","#f0b03a","#ff6b64"][mx]);
  $("clock").textContent = new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) +
                           "  " + new Date().toLocaleTimeString();
}

/* ---------- Rover movement: patrols tunnel, goes to hazard zone and stops ---------- */
function moveRover(){
  if (hz !== null) {
    var target = hz*110 + 55;
    rx += Math.sign(target-rx) * Math.min(3, Math.abs(target-rx));
  } else {
    rx += dir*1.5; if (rx > 420) dir = -1; if (rx < 20) dir = 1;
  }
  $("rover").setAttribute("transform","translate("+rx+",70)");
}

/* ---------- Camera display (canvas). Shows a simulated tunnel view, or a real camera if connected ---------- */
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawCam(){
  var c = $("cam"), g = c.getContext("2d"), W = 640, H = 380, vx = W/2, vy = 175;
  if (camLive && vid.readyState >= 2) { g.drawImage(vid,0,0,W,H); }
  else {
    g.fillStyle = "#0a0e11"; g.fillRect(0,0,W,H);
    g.fillStyle = "#1a2128"; g.beginPath();                    // floor
    g.moveTo(0,H); g.lineTo(W,H); g.lineTo(vx+30,vy+14); g.lineTo(vx-30,vy+14); g.fill();
    for (var i=0;i<11;i++){                                    // tunnel frames + ceiling lights
      var p = (i+ph)/11, s = Math.pow(p,2.2), hw = 14+s*330, hh = 9+s*190, op = .18+p*.6;
      g.strokeStyle = "rgba(159,176,188,"+op+")"; g.lineWidth = 1+p*3.5;
      g.strokeRect(vx-hw, vy-hh, 2*hw, 2*hh);
      g.fillStyle = "rgba(255,233,168,"+op+")"; g.fillRect(vx-(6+s*60)/2, vy-hh+2, 6+s*60, 2+s*6);
    }
    g.strokeStyle = "#7b8a96"; g.lineWidth = 3;                // rails
    [-1,1].forEach(function(k){ g.beginPath(); g.moveTo(vx+k*10,vy+14); g.lineTo(vx+k*190,H); g.stroke(); });
  }
  var col = mx==2 ? "#ff6b64" : "#f0b03a";
  if (mx > 0) {                                                // hazard tint + border
    g.fillStyle = mx==2 ? "rgba(255,107,100,.16)" : "rgba(240,176,58,.13)"; g.fillRect(0,0,W,H);
    g.strokeStyle = col; g.lineWidth = 4; rr(g,6,6,W-12,H-12,8); g.stroke();
  }
  g.fillStyle = (Date.now()%1000<600) ? "#ff6b64" : "#7a2f2c";  // REC dot
  g.beginPath(); g.arc(30,32,7,0,7); g.fill();
  g.fillStyle = "#fff"; g.font = "bold 15px sans-serif"; g.textAlign = "left";
  g.fillText("REC   ROVER-01 CAMERA", 44, 38);
  g.font = "14px sans-serif"; g.textAlign = "right";
  g.fillText("ZONE "+ZONES[zoneOf(rx)]+"  |  "+new Date().toLocaleTimeString(), W-24, 38);
  if (mx > 0) {                                                // alert banner
    g.fillStyle = "rgba(43,31,5,.92)"; rr(g,24,H-92,W-48,52,10); g.fill();
    g.strokeStyle = col; g.lineWidth = 2; g.stroke();
    var s = S[worst]; g.fillStyle = col; g.font = "bold 18px sans-serif"; g.textAlign = "center";
    g.fillText((mx==2?"DANGER: ":"ALERT: ")+s.n.split(" (")[0]+" "+s.v.toFixed(s.x)+" "+s.u+" detected in Zone "+ZONES[zoneOf(rx)], W/2, H-59);
  }
  if (hz === null) ph = (ph + (dir>0?.012:-.012) + 1) % 1; else ph = (ph + .002) % 1;   // slow drift when stopped
}

/* ---------- Buttons ---------- */
document.querySelector(".ctl").addEventListener("click", function(e){
  var d = e.target.getAttribute("data-sim");
  if (d === "reset") { S.forEach(function(s){ s.t = 0; s.e = 0; }); return; }
  if (d) d.split(",").forEach(function(i){ var s = S[+i]; s.t = (s.d - s.b) * 1.35; });
});
$("camBtn").onclick = function(){
  if (!navigator.mediaDevices) { alert("Camera is not available in this browser."); return; }
  navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
    vid.srcObject = stream; vid.muted = true; vid.play(); camLive = true; $("camBtn").textContent = "Camera connected";
  }).catch(function(){ alert("Could not access the camera. Showing the simulated rover view."); });
};

/* ---------- Start ---------- */
renderLog(); tick();
setInterval(tick, 1000);
setInterval(moveRover, 50);
setInterval(drawCam, 60);
</script>
</body>
</html>
